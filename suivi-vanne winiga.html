<style>
  :root{
    --bg:#0e1b23; --bg2:#132530; --panel:#16303d; --line:#254452;
    --ink:#eaf3f6; --ink-dim:#9fc2cf; --accent:#3aa6b8; --accent2:#e8b34a;
    --open:#4caf7d; --close:#e0637a;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f6f7; --bg2:#e7eff1; --panel:#ffffff; --line:#d7e2e5;
      --ink:#12262c; --ink-dim:#4a6670; --accent:#1c7d90; --accent2:#b6791c;
      --open:#2e8f5f; --close:#c23c56;
    }
  }
  :root[data-theme="dark"]{ /* keep dark tokens */ }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--ink); font-family:"Segoe UI",Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.2px;}
  .sub{color:var(--ink-dim);margin:0 0 24px;font-size:.92rem;}
  .timerSetup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .tlabel{font-size:.85rem;color:var(--ink-dim);display:block;margin-bottom:8px;}
  .tinputs{display:flex;align-items:center;gap:8px;}
  .tinputs input{width:64px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:1rem;}
  .tinputs span{color:var(--ink-dim);font-size:.9rem;margin-right:8px;}
  .btnValidate{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:.88rem;font-weight:600;cursor:pointer;}
  .btnValidate:disabled{opacity:.6;}
  .tstatus{font-size:.82rem;color:var(--ink-dim);margin-top:8px;min-height:16px;}
  .tstatus.ok{color:var(--open);font-weight:600;}
  .countdown{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center;}
  .cLabel{font-size:.82rem;color:var(--ink-dim);margin-bottom:6px;}
  .cTime{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);}
  .cTime.due{color:var(--close);}
  .ring{font-size:.75rem;color:var(--close);font-weight:700;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;}
  .btn{
    border:none;border-radius:14px;padding:20px 10px;font-size:1rem;font-weight:600;
    color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.open{background:var(--open);}
  .btn.close{background:var(--close);}
  .btn small{font-weight:400;opacity:.85;font-size:.78rem;}
  input[type=file]{display:none;}
  .status{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:24px;font-size:.9rem;color:var(--ink-dim);
    min-height:20px;
  }
  h2{font-size:1.05rem;margin:0 0 14px;}
  .entry{
    display:flex;gap:12px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;
  }
  .entry img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .entry .meta{flex:1;min-width:0;}
  .seeAll{color:var(--accent);font-size:.78rem;margin-top:3px;text-decoration:underline;cursor:pointer;}
  .btnMelody{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:12px;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:10px;}
  .melodyPanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .mOption{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-radius:8px;margin-bottom:6px;background:var(--bg2);}
  .mOption.selected{outline:2px solid var(--accent);}
  .mPreview{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer;}
  .btnSaveMelody{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:8px;}
  .modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
    align-items:center;justify-content:center;padding:20px;}
  .modalOverlay.show{display:flex;}
  .modalCard{background:var(--panel);border-radius:16px;padding:20px;max-width:420px;width:100%;position:relative;text-align:center;}
  .modalClose{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--ink-dim);font-size:1.2rem;cursor:pointer;}
  .modalCard img{width:100%;border-radius:12px;margin-bottom:14px;}
  .modalTag{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:20px;color:#fff;margin-bottom:8px;}
  .modalDate{font-size:1.05rem;font-weight:600;}
  .codeField{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:1.1rem;text-align:center;letter-spacing:4px;margin-bottom:10px;}
  .codeError{color:var(--close);font-size:.85rem;min-height:18px;margin-bottom:6px;}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:4px;color:#fff;}
  .tag.o{background:var(--open);} .tag.f{background:var(--close);}
  .entry .dt{font-size:.88rem;} .entry .dt b{font-weight:600;}
  .empty{color:var(--ink-dim);font-size:.9rem;padding:20px 0;text-align:center;}
  .clear{margin-top:18px;background:none;border:1px solid var(--line);color:var(--ink-dim);
    border-radius:10px;padding:10px;width:100%;font-size:.85rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Suivi de la vanne</h1>
  <p class="sub">Prends une photo à chaque ouverture et fermeture — date et heure enregistrées automatiquement.</p>

  <button class="btnMelody" id="btnMelodyToggle">🎵 Choisir la sonnerie</button>
  <div class="melodyPanel" id="melodyPanel" style="display:none;">
    <div class="mOption" data-id="classique">
      <span>Classique</span>
      <button class="mPreview" data-id="classique">▶ Écouter</button>
    </div>
    <div class="mOption" data-id="double">
      <span>Alerte double</span>
      <button class="mPreview" data-id="double">▶ Écouter</button>
    </div>
    <div class="mOption" data-id="sirene">
      <span>Sirène</span>
      <button class="mPreview" data-id="sirene">▶ Écouter</button>
    </div>
    <div class="mOption" data-id="cloche">
      <span>Cloche</span>
      <button class="mPreview" data-id="cloche">▶ Écouter</button>
    </div>
    <button class="btnSaveMelody" id="btnSaveMelody">Enregistrer la mélodie</button>
    <div class="tstatus" id="melodyStatus"></div>
  </div>

  <div class="timerSetup" id="timerSetup">
    <label class="tlabel">Durée de la minuterie</label>
    <div class="tinputs">
      <input type="number" id="durH" min="0" max="23" value="4"><span>h</span>
      <input type="number" id="durM" min="0" max="59" value="0"><span>min</span>
      <button id="btnValidate" class="btnValidate">Valider</button>
    </div>
    <div class="tstatus" id="tstatus"></div>
  </div>

  <div id="countdownBox" class="countdown" style="display:none;">
    <div class="cLabel">Temps restant avant fermeture prévue <span id="ringingBadge" class="ring" style="display:none;">🔔 Sonnerie</span></div>
    <div class="cTime" id="cTime">--:--:--</div>
  </div>

  <div class="actions">
    <button class="btn open" id="btnOpen">📸 Vanne ouverte<small>démarrer la minuterie</small></button>
    <button class="btn close" id="btnClose">📸 Vanne fermée<small>arrêter la minuterie</small></button>
  </div>
  <input type="file" id="fileOpen" accept="image/*" capture="environment">
  <input type="file" id="fileClose" accept="image/*" capture="environment">

  <div class="status" id="status">Aucune action pour le moment.</div>

  <h2>Historique</h2>
  <div id="history"></div>
  <button class="clear" id="clearBtn">Effacer tout l'historique</button>
</div>

<div class="modalOverlay" id="codeOverlay">
  <div class="modalCard" id="codeCard">
    <button class="modalClose" id="codeClose">✕</button>
    <h3 id="codeTitle" style="margin-top:0;"></h3>
    <p id="codeMsg" style="color:var(--ink-dim);font-size:.85rem;"></p>
    <input type="password" inputmode="numeric" id="codeInput1" class="codeField" placeholder="Code">
    <input type="password" inputmode="numeric" id="codeInput2" class="codeField" placeholder="Confirme le code" style="display:none;">
    <div id="codeError" class="codeError"></div>
    <button class="btnSaveMelody" id="codeSubmit">Valider</button>
  </div>
</div>

<div class="modalOverlay" id="modalOverlay">
  <div class="modalCard">
    <button class="modalClose" id="modalClose">✕</button>
    <img id="modalImg" src="" alt="">
    <div class="modalTag" id="modalTag"></div>
    <div class="modalDate" id="modalDate"></div>
  </div>
</div>

<script>
const KEY = "vanne_history_v1";

function loadHistory(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveHistory(list){
  try{ localStorage.setItem(KEY, JSON.stringify(list)); return true; }
  catch(e){ document.getElementById('status').textContent = "Erreur : impossible d'enregistrer (mémoire pleine)."; return false; }
}
function fmt(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} à ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function render(){
  const list = loadHistory();
  const el = document.getElementById('history');
  if(list.length === 0){
    el.innerHTML = '<div class="empty">Aucune entrée enregistrée.</div>';
    return;
  }
  el.innerHTML = list.slice().reverse().map(item => `
    <div class="entry" data-ts="${item.ts}">
      <img src="${item.photo}" alt="">
      <div class="meta">
        <span class="tag ${item.type==='open'?'o':'f'}">${item.type==='open'?'OUVERTURE':'FERMETURE'}</span>
        <div class="dt"><b>${fmt(item.ts)}</b></div>
        <div class="seeAll">Voir toutes les informations</div>
      </div>
    </div>
  `).join('');
}
let audioCtx = null;
function ensureAudioCtx(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  }catch(e){}
}
let alarmInterval = null;
function startAlarmSound(){
  if(alarmInterval) return;
  ensureAudioCtx();
  playMelody(selectedMelody);
  alarmInterval = setInterval(() => playMelody(selectedMelody), melodyDurationMs(selectedMelody));
  document.getElementById('ringingBadge').style.display = 'inline-block';
}
function stopAlarmSound(){
  if(alarmInterval){ clearInterval(alarmInterval); alarmInterval = null; }
  document.getElementById('ringingBadge').style.display = 'none';
}

let durationValidated = false;
function setupDurationValidation(){
  const btn = document.getElementById('btnValidate');
  const durH = document.getElementById('durH');
  const durM = document.getElementById('durM');
  const status = document.getElementById('tstatus');
  btn.addEventListener('click', () => {
    if(!durationValidated){
      const h = parseInt(durH.value,10) || 0;
      const m = parseInt(durM.value,10) || 0;
      if(h === 0 && m === 0){
        status.textContent = "Choisis une durée avant de valider.";
        status.classList.remove('ok');
        return;
      }
      durH.disabled = true; durM.disabled = true;
      btn.textContent = "Modifier";
      status.textContent = `Durée validée : ${h}h ${String(m).padStart(2,'0')}min — tu peux lancer la minuterie.`;
      status.classList.add('ok');
      durationValidated = true;
    } else {
      durH.disabled = false; durM.disabled = false;
      btn.textContent = "Valider";
      status.textContent = "";
      status.classList.remove('ok');
      durationValidated = false;
    }
  });
}

const MELODIES = {
  classique: [{f:880,d:.25}],
  double:    [{f:700,d:.15},{f:1000,d:.15}],
  sirene:    [{f:500,d:.2},{f:900,d:.2},{f:500,d:.2}],
  cloche:    [{f:1046,d:.35},{f:784,d:.35}]
};
let selectedMelody = 'classique';
try{ selectedMelody = localStorage.getItem('vanne_melody') || 'classique'; }catch(e){}

function playMelody(id){
  ensureAudioCtx();
  if(!audioCtx) return;
  const notes = MELODIES[id] || MELODIES.classique;
  let t = audioCtx.currentTime;
  notes.forEach(n => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = n.f;
    gain.gain.value = 0.18;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + n.d);
    t += n.d + 0.05;
  });
}
function melodyDurationMs(id){
  const notes = MELODIES[id] || MELODIES.classique;
  return notes.reduce((s,n) => s + n.d + 0.05, 0) * 1000 + 400;
}
function setupMelodyPanel(){
  const toggle = document.getElementById('btnMelodyToggle');
  const panel = document.getElementById('melodyPanel');
  toggle.addEventListener('click', () => {
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  document.querySelectorAll('.mOption').forEach(opt => {
    if(opt.dataset.id === selectedMelody) opt.classList.add('selected');
    opt.addEventListener('click', (e) => {
      if(e.target.classList.contains('mPreview')) return;
      document.querySelectorAll('.mOption').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.dataset.pending = "1";
    });
  });
  document.querySelectorAll('.mPreview').forEach(btn => {
    btn.addEventListener('click', () => playMelody(btn.dataset.id));
  });
  document.getElementById('btnSaveMelody').addEventListener('click', () => {
    const chosen = document.querySelector('.mOption.selected');
    const id = chosen ? chosen.dataset.id : 'classique';
    selectedMelody = id;
    try{ localStorage.setItem('vanne_melody', id); }catch(e){}
    const status = document.getElementById('melodyStatus');
    status.textContent = "Mélodie enregistrée.";
    status.classList.add('ok');
  });
}
function setupDetailsModal(){
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('history').addEventListener('click', (e) => {
    const entry = e.target.closest('.entry');
    if(!entry) return;
    const ts = parseInt(entry.dataset.ts,10);
    const list = loadHistory();
    const item = list.find(i => i.ts === ts);
    if(!item) return;
    document.getElementById('modalImg').src = item.photo;
    const tagEl = document.getElementById('modalTag');
    tagEl.textContent = item.type === 'open' ? 'OUVERTURE' : 'FERMETURE';
    tagEl.style.background = item.type === 'open' ? 'var(--open)' : 'var(--close)';
    document.getElementById('modalDate').textContent = fmt(item.ts);
    overlay.classList.add('show');
  });
  document.getElementById('modalClose').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });
}

function addEntry(type, dataUrl){
  const list = loadHistory();
  list.push({ type, ts: Date.now(), photo: dataUrl });
  const ok = saveHistory(list);
  render();
  if(!ok) return;

  document.getElementById('status').textContent =
    (type === 'open' ? "Ouverture" : "Fermeture") + " enregistrée à " + fmt(Date.now()) + ".";

  if(type === 'open'){
    const h = parseInt(document.getElementById('durH').value,10) || 0;
    const m = parseInt(document.getElementById('durM').value,10) || 0;
    const durationMs = (h*3600 + m*60) * 1000;
    const endTs = Date.now() + durationMs;
    try{ localStorage.setItem('vanne_timer_end', String(endTs)); }catch(e){}
    if("Notification" in window && Notification.permission === "default"){
      Notification.requestPermission();
    }
    startCountdown(endTs);
  } else {
    try{ localStorage.removeItem('vanne_timer_end'); }catch(e){}
    stopCountdown();
    stopAlarmSound();
    durationValidated = false;
    document.getElementById('durH').disabled = false;
    document.getElementById('durM').disabled = false;
    document.getElementById('btnValidate').textContent = "Valider";
    document.getElementById('tstatus').textContent = "";
    document.getElementById('tstatus').classList.remove('ok');
  }
}

let countdownInterval = null;
function startCountdown(endTs){
  stopCountdown();
  const box = document.getElementById('countdownBox');
  const timeEl = document.getElementById('cTime');
  box.style.display = 'block';
  let notified = false;
  function tick(){
    const remain = endTs - Date.now();
    if(remain <= 0){
      timeEl.textContent = "Terminé — ferme la vanne";
      timeEl.classList.add('due');
      if(!notified){
        notified = true;
        try{
          if("Notification" in window && Notification.permission === "granted"){
            new Notification("Minuterie terminée", { body: "Il est temps de fermer la vanne et de prendre la photo." });
          }
        }catch(e){}
        if(navigator.vibrate){ try{ navigator.vibrate([300,150,300,150,300]); }catch(e){} }
        startAlarmSound();
      }
      return;
    }
    const s = Math.floor(remain/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    timeEl.textContent = `${hh}:${mm}:${ss}`;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}
function stopCountdown(){
  if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
  document.getElementById('countdownBox').style.display = 'none';
}
function resumeCountdownIfActive(){
  try{
    const endTs = localStorage.getItem('vanne_timer_end');
    if(endTs){ startCountdown(parseInt(endTs,10)); }
  }catch(e){}
}
function bindCapture(btnId, fileId, type){
  const btn = document.getElementById(btnId);
  const input = document.getElementById(fileId);
  btn.addEventListener('click', () => {
    if(type === 'open' && !durationValidated){
      document.getElementById('tstatus').textContent = "Valide d'abord la durée de la minuterie ci-dessus.";
      return;
    }
    ensureAudioCtx(); input.click();
  });
  input.addEventListener('change', () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 700;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.6);
        addEntry(type, compressed);
      };
      img.onerror = () => { document.getElementById('status').textContent = "Erreur de lecture de la photo."; };
      img.src = reader.result;
    };
    reader.onerror = () => { document.getElementById('status').textContent = "Erreur de lecture de la photo."; };
    reader.readAsDataURL(file);
    input.value = "";
  });
}
bindCapture('btnOpen','fileOpen','open');
bindCapture('btnClose','fileClose','close');
setupDurationValidation();
setupMelodyPanel();
setupDetailsModal();
setupClearCode();

function setupClearCode(){
  const overlay = document.getElementById('codeOverlay');
  const title = document.getElementById('codeTitle');
  const msg = document.getElementById('codeMsg');
  const in1 = document.getElementById('codeInput1');
  const in2 = document.getElementById('codeInput2');
  const err = document.getElementById('codeError');
  const submit = document.getElementById('codeSubmit');
  let mode = 'verify';

  function openModal(){
    let savedCode = null;
    try{ savedCode = localStorage.getItem('vanne_clear_code'); }catch(e){}
    err.textContent = ""; in1.value = ""; in2.value = "";
    if(!savedCode){
      mode = 'setup';
      title.textContent = "Créer un code";
      msg.textContent = "Ce code te sera demandé pour effacer l'historique.";
      in1.placeholder = "Nouveau code";
      in2.style.display = 'block';
    } else {
      mode = 'verify';
      title.textContent = "Entrer le code";
      msg.textContent = "Saisis le code pour effacer tout l'historique.";
      in1.placeholder = "Code";
      in2.style.display = 'none';
    }
    overlay.classList.add('show');
    in1.focus();
  }
  function closeModal(){ overlay.classList.remove('show'); }

  document.getElementById('clearBtn').addEventListener('click', openModal);
  document.getElementById('codeClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

  submit.addEventListener('click', () => {
    if(mode === 'setup'){
      const c1 = in1.value.trim(), c2 = in2.value.trim();
      if(c1 === ""){ err.textContent = "Entre un code."; return; }
      if(c1 !== c2){ err.textContent = "Les deux codes ne correspondent pas."; return; }
      try{ localStorage.setItem('vanne_clear_code', c1); }catch(e){}
      closeModal();
      document.getElementById('status').textContent = "Code créé. Appuie à nouveau sur \"Effacer\" pour l'utiliser.";
    } else {
      let savedCode = null;
      try{ savedCode = localStorage.getItem('vanne_clear_code'); }catch(e){}
      if(in1.value.trim() !== savedCode){
        err.textContent = "Code incorrect.";
        return;
      }
      try{ localStorage.removeItem(KEY); }catch(e){}
      closeModal();
      render();
      document.getElementById('status').textContent = "Historique effacé.";
    }
  });
}

render();
resumeCountdownIfActive();
</script>
</body>
</html>
